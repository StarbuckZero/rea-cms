<article class="event">
    <a href="/api/v1/events/{event.id}.html"><img src="{event.image}" alt="{event.title}"><h2>{event.title}</h2></a>
    <p>{event.shortDescription}</p><p>{event.location}</p>
    <time datetime="{event.startDateTime}">{event.formattedDate}</time>
    <p>{event.formattedTime}</p>
</article>
