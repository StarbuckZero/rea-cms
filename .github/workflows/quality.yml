name: Quality and database compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, mbstring, openssl, pdo_mysql, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: composer check
      - run: composer audit --locked
      - run: npm audit --omit=dev
      - run: npm run build
      - run: git diff --exit-code -- public/assets

  database-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database:
          - mysql:8.0
          - mariadb:10.11
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: rea_cms_test
          MYSQL_USER: rea_cms
          MYSQL_PASSWORD: rea_cms_test
          MYSQL_ROOT_PASSWORD: root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo, mbstring, openssl, pdo_mysql, zip, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Configure test database
        run: |
          cp .env.example .env
          sed -i 's/DB_DATABASE=rea_cms_dev/DB_DATABASE=rea_cms_test/' .env
          sed -i 's/DB_USERNAME=rea_cms_dev/DB_USERNAME=rea_cms/' .env
          sed -i 's/DB_PASSWORD=replace-with-a-strong-local-password/DB_PASSWORD=rea_cms_test/' .env
      - name: Verify repeatable migrations
        run: |
          php bin/migrate.php
          php bin/migrate.php
          php bin/install-reference-blog.php --enable
          php bin/install-reference-blog.php --enable
          php bin/install-reference-gallery.php --enable
          php bin/install-reference-gallery.php --enable
